<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D4AF5A"/>
      <stop offset="55%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8852A"/>
    </linearGradient>
    <linearGradient id="goldD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#A8852A"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="200" height="200" rx="28" fill="#0A0A0A"/>

  <!-- Subtle gold border -->
  <rect x="2" y="2" width="196" height="196" rx="26.5"
        fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.28"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#goldH)"/>

  <!-- ── B letterform ───────────────────────────────────── -->
  <!-- Vertical stem -->
  <rect x="50" y="44" width="15" height="112" rx="3.5" fill="#C9A84C"/>

  <!-- Top lobe (D-curve) -->
  <!-- M65,44 → line down to 65,99 → cubic bezier back up through right side -->
  <path d="M65 44 L65 99 C 119 99 119 44 65 44 Z" fill="#C9A84C"/>

  <!-- 2-px dark gap between lobes creates the B waist (gap y=99→101) -->

  <!-- Bottom lobe (wider D-curve) -->
  <path d="M65 101 L65 156 C 130 156 130 101 65 101 Z" fill="#C9A84C"/>

  <!-- ── Booking dots (3 stacked circles = available slots) ─ -->
  <circle cx="154" cy="87"  r="7" fill="url(#goldD)" opacity="0.70"/>
  <circle cx="154" cy="107" r="7" fill="url(#goldD)" opacity="0.44"/>
  <circle cx="154" cy="127" r="7" fill="url(#goldD)" opacity="0.22"/>
</svg>
