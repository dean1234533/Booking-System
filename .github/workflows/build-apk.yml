name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --force

      - name: Install Capacitor packages
        run: npm install @capacitor/android @capacitor/core --force

      - name: Build web app
        run: npm run build

      - name: Copy web assets to Android
        run: rm -rf android/app/src/main/assets/public && mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/

      - name: Update capacitor.config in assets
        run: cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
